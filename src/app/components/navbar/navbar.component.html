<nav class="navbar" [class.scrolled]="isScrolled()">
  <div class="container nav-inner">
    <a class="logo" (click)="scrollTo('hero')" (keydown.enter)="scrollTo('hero')" tabindex="0">
      RF<span>.</span>
    </a>

    <ul class="nav-links" [class.open]="menuOpen()">
      @for (link of navLinks; track link.href) {
        <li>
          <a
            (click)="scrollTo(link.href)"
            (keydown.enter)="scrollTo(link.href)"
            tabindex="0"
            [class.active]="activeSection() === link.href"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <div class="nav-actions">
      <button class="nav-cta" (click)="scrollTo('contacto')">Contactar</button>

      <button
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
        [attr.aria-expanded]="menuOpen()"
      >
        <span class="hamburger" [class.open]="menuOpen()"></span>
      </button>
    </div>
  </div>
</nav>
