<section id="skills" class="skills">
  <div class="container">
    <div class="section-header fade-up">
      <div>
        <p class="section-label">Stack</p>
        <h2 class="section-title">Las herramientas con las que trabajo.</h2>
      </div>
      <p class="section-subtitle">
        Tecnologías que he usado en producción durante años,
        agrupadas por área.
      </p>
    </div>

    <div class="skills-grid">
      @for (group of skillGroups; track group.title; let i = $index) {
        <div class="skill-card fade-up" [style.transition-delay]="(i * 60) + 'ms'">
          <h3 class="skill-group-title">{{ group.title }}</h3>
          <div class="skill-tags">
            @for (skill of group.skills; track skill) {
              <span class="tag">{{ skill }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
